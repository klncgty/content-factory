# Engine-seviyesi (marka-bağımsız) VARSAYILAN model routing.
# Her marka, brands/{brand}/models.yaml ile bu değerleri override edebilir (opsiyonel dosya).
#
# Sistem TEK bir provider'a bağımlı değildir: tüm çağrılar `BaseLLMProvider` arayüzü üzerinden
# yapılır; varsayılan implementasyon `OpenRouterProvider`'dır (bkz. ARCHITECTURE.md §9,
# providers/llm/README.md). OpenRouter "provider/model" string formatıyla Anthropic/OpenAI/
# Google/vb. modellerini tek bir API ve tek bir API key ile sunduğu için, agent kodu hangi
# sağlayıcının kullanıldığını hiç bilmez — yalnızca bu config'i okur.

default_provider: openrouter

# Her agent rolü için ayrı model seçilebilir (aşağıdakiler örnek/başlangıç değerleridir,
# maliyet/kalite testlerine göre Faz 1'de ayarlanacak).
agents:
  topic_scout:
    provider: groq
    model: openai/gpt-oss-120b
    temperature: 0.6
    max_tokens: 4000
    fallback_models: [ ]

  research:
    model: openai/gpt-oss-20b:free
    temperature: 0.2
    max_tokens: 3000
    # Düşük temperature: burası spekülasyon değil, verilen referans bilgiyi özetleme işi.

  strategist:
    model: openai/gpt-oss-20b:free
    temperature: 0.4
    max_tokens: 2000

  writer:
    provider: groq
    model: openai/gpt-oss-120b
    fallback_models: []   # openai/gpt-5 fallback'i de bakiye gerektirdiği için kaldırıldı
    # Groq model seçimi yazma ajanını doğrudan bu sağlığa yönlendirir.
    max_tokens: 4000

  seo_optimizer:
    model: openai/gpt-oss-20b:free
    temperature: 0.3
    max_tokens: 3000

  linker:
    model: openai/gpt-oss-20b:free
    temperature: 0.3
    max_tokens: 3000

  image_generator:
    # Görsel üretimi metin tamamlamadan ayrı bir endpoint kullanır, bu yüzden ImageProvider
    # LLMProvider'dan ayrı bir arayüzdür (bkz. ARCHITECTURE.md §4, integrations/image_client.py).
    #
    # replicate: REPLICATE_API_KEY ile doğrudan Replicate'e bağlanır. Varsayılan olmasının
    # nedeni ölçüm: google-ai-studio bu hesapta görsel modellerinde `limit: 0` ile 429
    # döndürüyor (ücretsiz kota metinde var, görselde yok) ve makaleler görselsiz
    # yayınlanıyordu; flux-schnell ise ~0.6 saniyede görsel başına ~0.003 USD ile üretiyor.
    #
    # Alternatifler:
    #   provider: google-ai-studio   model: gemini-2.5-flash-image      (GEMINI_API_KEY)
    #   provider: openrouter         model: google/gemini-2.5-flash-image
    provider: replicate
    # Replicate'te model adı `sahip/model` biçimindedir; sürüm kimliği config'de tutulmaz,
    # sağlayıcı her üretimde güncel sürümü API'den okur.
    model: black-forest-labs/flux-schnell
    images_per_article: 1  # tek temel görsel üretilir, 3 türev (cover/thumbnail/og) resize ile çıkarılır

    # En büyük türev 1600x900 (cover) olduğu için temel görsel de 16:9 istenir — böylece
    # image_processing yalnızca küçültme yapar, en-boy oranı kırpması gerekmez.
    # Replicate'te input.aspect_ratio, Gemini'de generationConfig.imageConfig.aspectRatio
    # olarak gönderilir.
    aspect_ratio: "16:9"

    # resolution: YALNIZCA openrouter sağlayıcısında ve yalnızca destekleyen modellerde
    # anlamlıdır (ör. google/gemini-3.1-flash-image). gemini-2.5-flash-image DESTEKLEMEZ.
    #
    # OpenRouter'a geri dönmek için:
    #   provider: openrouter
    #   model: google/gemini-2.5-flash-image      # OpenRouter "saglayici/model" biçimi ister
    # Desteklenen parametreler: https://openrouter.ai/api/v1/images/models

  editor:
    model: openai/gpt-oss-20b:free
    temperature: 0.2
    max_tokens: 3000
    # Bu agent zorunlu geçittir (ARCHITECTURE.md §3) — farklı bir sağlayıcı kullanmak
    # (writer'dan farklı bir "göz") kör noktaları azaltmak için kasıtlı bir tasarım tercihidir.

  scope_guard:
    # ScopeGuard.post_check burayı kullanır (bkz. guards/scope_guard.py). EditorAgent'ın
    # kendi modelinden bağımsız, ucuz/hızlı bir sınıflandırma modeli yeterlidir.
    model: openai/gpt-oss-20b:free
    temperature: 0.0
    max_tokens: 300
