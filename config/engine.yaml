# Engine-seviyesi (marka-bağımsız) çalışma zamanı ayarları.

retries:
  editor_reject_max_retries: 2      # Writer'a geri dönüş sayısı
  scope_reject_max_retries: 2       # TopicScout'a geri dönüş sayısı
  llm_call_max_retries: 3           # ağ/rate-limit hataları için
  # Asıl model VE tüm fallback'ler rate limit'e takıldığında toplam bekleme bütçesi.
  # Ücretsiz kademelerde (Groq TPM, OpenRouter dakikalık) sınır dakikalıktır; beklemeden
  # vazgeçmek yarısı üretilmiş bir makaleyi çöpe atar. 0 = hiç bekleme.
  rate_limit_max_wait_seconds: 90

timeouts:
  llm_call_seconds: 120
  image_generation_seconds: 180
  pipeline_run_seconds: 1800

# ImageGeneratorAgent'ın tek bir temel görselden ürettiği türevler (bkz. ARCHITECTURE.md §4).
#
# Cover boyutu, temel görselin GERÇEK boyutuna göre seçilir: varsayılan sağlayıcı
# (replicate + flux-schnell) en fazla ~1 megapiksel üretir, 16:9'da bu 1344x768'e denk
# gelir. Cover 1600x900 bırakıldığında image_processing her makalede upscale yapıp
# "keskinlik düşebilir" uyarısı veriyordu. Daha büyük bir cover gerekiyorsa temel
# görseli de büyütmek gerekir (ör. black-forest-labs/flux-1.1-pro; görsel maliyeti
# ~0.003 -> ~0.04 USD).
image_derivatives:
  cover:
    size: [1344, 768]
    format: webp
  thumbnail:
    size: [600, 450]
    format: webp
  og_image:
    size: [1200, 630]
    format: webp

state_store:
  backend: sqlite
  path_template: "data/{brand}/content_factory.db"

run_artifacts:
  path_template: "state/{brand}/runs/{run_id}"
  retention_days: 90
