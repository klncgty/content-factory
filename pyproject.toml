[project]
name = "content-factory"
version = "0.1.0"
description = "Marka-bağımsız, çoklu markaya genişleyebilecek otonom AI blog/SEO içerik üretim motoru."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "Pillow>=10.0",
    # Growth Intelligence workflow'u (bkz. ARCHITECTURE.md §19). Yalnızca graf/checkpoint/
    # interrupt için; LLM çağrıları LangChain'den GEÇMEZ, mevcut BaseLLMProvider kullanılır.
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    # GA4/Search Console service account JWT imzalama ve token yenileme. API çağrıları
    # ham httpx ile yapılır — ağır Google SDK'ları eklenmez.
    "google-auth>=2.30",
    # Site denetimi için HTML parse. lxml (C derlemesi) gerektirmez.
    "selectolax>=0.3.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
dashboard = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.scripts]
content-factory = "content_factory.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/content_factory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
