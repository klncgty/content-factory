# Oleart marka kimliği — YALNIZCA deterministik/structured kurallar burada.
# Anlatı/ses/hikaye niteliğindeki bilgi knowledge/*.md içinde tutulur (LLM bağlamı için).
# Bu ayrım bilinçli: brand.yaml'daki alanlar EditorAgent tarafından kod ile kontrol edilebilir
# (ör. min/max kelime sayısı, yasaklı ifadeler); knowledge/ ise LLM'e "okuma metni" olarak verilir.

brand: oleart
display_name: Oleart
website: https://oleart.co
language: tr

content_bounds:
  # VARSAYILAN sınırlar — `by_content_type` altında karşılığı olmayan her makale için.
  #
  # 800 -> 700 (04.08.2026). 800'lük taban modeli sürekli "uzatma" moduna sokuyordu:
  # Writer hedefi tutturmak için bölüm sonlarına dolgu paragraflar ekliyor, genişletme
  # turunda ise talimat metne sızabiliyordu (yayından geri alınan makalede altı yerde
  # "**Yeni paragraf:**" etiketi kalmıştı). Daha düşük bir taban, modelin doğal
  # uzunluğuna yakın olduğu için şişirmeye gerek bırakmıyor.
  min_word_count: 700
  max_word_count: 1500

  # İçerik tipine göre sınırlar (07.08.2026). Tek bir global taban yanlış varsayıma
  # dayanıyordu: her makalenin doğal uzunluğu aynı değil.
  #
  # Ölçüm: tarif makalelerinin ilk taslakları 459, 512, 522, 665 kelime çıkarken
  # açıklayıcı makaleler 805 ve 919 kelimeye doğal olarak ulaştı. 700 tabanı tarifleri
  # sürekli genişletme + Editor retry döngüsüne sokuyordu — ve asıl zarar buydu: model
  # tabanı tutturmak için dolgu yazıyordu. Yayınlanan bir tarifin "Malzemeler" bölümünde,
  # malzeme listesinden sonra zeytinyağının nasıl saklandığını ve kaç derecede
  # bulanıklaştığını anlatan iki paragraf vardı. Bu, tarif aramalarında okuru kaçıran ve
  # arama motorlarının "yardımcı olmayan içerik" saydığı klasik dolgu kalıbı.
  #
  # `description` alanı Strategist'e verilir: tipi o seçer, sayıları burası belirler
  # (bkz. agents/strategist.py::_content_type_catalog).
  by_content_type:
    recipe:
      description: >-
        Belirli bir yemeğin nasıl yapıldığını malzeme listesi ve adımlarla anlatan tarif
      # 450 tabanı, ölçülen doğal tarif uzunluğunun (459-665) hemen altında: çoğu tarif
      # ilk taslakta geçer, genişletme turu hiç tetiklenmez. 900 tavanı dolgunun geri
      # gelmesini engeller — bir tarif 900 kelimeyi aşıyorsa artık tarif değildir.
      min_word_count: 450
      max_word_count: 900
    guide:
      description: >-
        Bir konuyu açıklayan, karşılaştıran ya da nasıl yapılacağını öğreten rehber yazı
      # Varsayılanla aynı: bu tipteki iki makale 805 ve 919 kelimeye doğal olarak ulaştı,
      # değiştirmeyi gerektiren bir ölçüm yok.
      min_word_count: 700
      max_word_count: 1500

forbidden_words:
  - "mucize"
  - "kesin çözüm"
  - "%100 garanti"

  # Olumsuz çerçeveleme. Marka içeriği olumlu ve yol gösterici olmalı: bir ürünün güçlü
  # yanları anlatılır, "avantaj/dezavantaj" tartışması açılmaz. Liste birebir aranır,
  # bu yüzden yalnızca tek başına olumsuz olan kalıplar yazılıdır — "zarar" gibi bir kök
  # yazılsaydı "zararlı güneş ışığından koruyun" gibi meşru bir cümle de reddedilirdi.
  - "dezavantaj"
  - "zararları"
  - "sakıncaları"
  - "olumsuz yanları"
  - "kötü yanları"

  # Türkçe karşılığı olan İngilizce terimler. Gerekçe: hedef kitle son tüketici, teknik
  # jargon halka hitap etmiyor ("Zeytinyağı Smoke Pointı Nedir?" gibi bir başlık okuru
  # uzaklaştırır). Karşılıkları prompts/writer/system.md'de tablo hâlinde veriliyor.
  #
  # Bu liste birebir (case-insensitive) aranır, yani bir güvenlik ağıdır — kapsamlı
  # olması beklenmez. Listede olmayan İngilizce terimleri Editor'ın LLM katmanı yakalar
  # (bkz. prompts/editor/system.md), üretim tarafında ise TopicScout ve Writer prompt'ları
  # baştan engeller. Türkçeleşmiş sözcükler (polifenol, antioksidan, aroma) serbesttir;
  # burada yasaklananlar İngilizce yazımlarıdır.
  - "smoke point"      # -> duman noktası
  - "cold press"       # -> soğuk sıkım
  - "extra virgin"     # -> natürel sızma
  - "polyphenol"       # -> polifenol
  - "antioxidant"      # -> antioksidan
  - "free radical"     # -> serbest radikal
  - "superfood"        # -> süper besin
  - "shelf life"       # -> raf ömrü
  - "raw material"     # -> hammadde
  - "food grade"       # -> gıdayla temasa uygun

# EditorAgent bu listeye karşı deterministik kontrol yapar.
# Zeytinyağı/ahşap ürünler için kanıtsız sağlık/tedavi iddiaları Türkiye reklam mevzuatına
# aykırı olabilir — kritik guardrail.
forbidden_claims:
  - "hastalığı tedavi eder"
  - "kanseri önler / tedavi eder"
  - "ilaç yerine geçer"
  - "kaynak gösterilmeyen klinik/istatistiksel sağlık iddiaları"

scope_file: scope.yaml   # brands/oleart/scope.yaml — bkz. ARCHITECTURE.md §2

# Not: knowledge/*.md konumu artık burada yapılandırılmaz — sabit bir sistem geneli
# kuralla knowledge/brands/oleart/ altında yaşar (bkz. knowledge/README.md).
