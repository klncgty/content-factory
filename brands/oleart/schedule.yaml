# Zamanlama konfigürasyonu (Faz 2'de scheduler tarafından okunur).

# NOT: Bu dosya henüz hiçbir kod tarafından OKUNMUYOR (Faz 2 scheduler'ı için duruyor).
# Yayın ritmini bugün belirleyen yer `.github/workflows/publish.yml` içindeki cron'dur;
# ikisi tutarlı tutulmalı.
cron: "20 12 */3 * *"    # 3 günde bir 15:20 Europe/Istanbul (= 12:20 UTC; TR kalıcı UTC+3)
timezone: "Europe/Istanbul"

max_publishes_per_run: 1
max_publishes_per_day: 1   # kaçak/hatalı döngüye karşı üst sınır
