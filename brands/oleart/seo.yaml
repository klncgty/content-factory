# SEO strateji konfigürasyonu — TopicScoutAgent ve SEOOptimizerAgent tarafından okunur.
# Not: konu kümeleri scope.yaml'daki grup/anahtar kelimelerle tutarlı olmalı.

keyword_clusters:
  - group: olive_and_oil
    seed_keywords: ["soğuk sıkım zeytinyağı", "erken hasat zeytinyağı", "naturel sızma zeytinyağı nedir"]
  - group: olive_and_oil
    seed_keywords: ["zeytinyağı nasıl saklanır", "zeytinyağı hangi yemeklerde kullanılır"]
  - group: wooden_products
    seed_keywords: ["zeytin ağacı kesme tahtası bakımı", "zeytin ağacı mutfak gereçleri avantajları"]

competitor_domains: []   # Faz 1'de doldurulacak

internal_linking:
  min_related_articles: 2
  max_related_articles: 5
  # LinkerAgent'ın uyguladığı mekanizma — bkz. ARCHITECTURE.md §5
  mechanism: structured_related_articles_frontmatter

publish_cadence: weekly   # schedule.yaml içindeki cron ile senkron olmalı

# Aynı hedef kelimenin birden fazla makalede kullanılmasını (keyword cannibalization) önlemek
# için StrategistAgent bu dosyayla değil SQLite `keywords` tablosuyla karşılaştırma yapar.
