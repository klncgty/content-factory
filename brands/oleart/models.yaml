# GEÇİCİ ÜCRETSİZ TEST PROFİLİ — bakiye eklendikten sonra BU DOSYAYI SİLİN.
#
# Neden var: config/models.yaml'daki varsayılanlar OpenRouter'ın `:free` modellerine
# dayanıyor. OpenRouter ücretsiz kademesi GÜNDE 50 istek veriyor ("free-models-per-day";
# 10 kredi eklenirse 1000/gün olur); tek bir pipeline run'ı editor retry'larıyla birlikte
# 12-16 çağrı harcadığı için bu kota birkaç run'da tükeniyor ve tüm metin agent'ları
# 429 ile duruyor. Bu dosya tüm rolleri Groq'a alır (GROQ_API_KEY).
#
# Bu dosya config/models.yaml'ı SİLMEZ, üzerine deep-merge edilir (bkz.
# settings/loader.py::Settings.load) — yalnızca aşağıda yazan alanlar değişir.
#
# Groq ücretsiz kademesinde sınır MODEL BAŞINA dakikalık token'dır (TPM) ve tek bir
# istek `prompt + max_tokens` kadar token rezerve eder; tavanı aşan istek 413 döner
# (ölçülen: llama-3.3-70b 12k, gpt-oss-120b/20b 8k, qwen3.6-27b 8k, llama-3.1-8b 6k).
# Bu yüzden aşağıda üç şey yapılır:
#   1. max_tokens gerçek çıktı boyutuna göre ayarlanır (rezervasyonu küçültür),
#   2. her role FARKLI bir modelden fallback verilir — bir modelin dakikalık kotası
#      dolduğunda run ölmez, sıradaki modele geçer (bkz. providers/llm/base.py),
#   3. JSON döndüren roller için fallback de reasoning YAPMAYAN bir model seçilir:
#      gpt-oss gibi modeller küçük max_tokens ile bütçeyi düşünmede tüketip boş içerik
#      döndürüyor (finish_reason=length).
# Ayrıca editor bilinçli olarak writer'dan farklı bir model ailesindedir
# (ARCHITECTURE.md §4 "farklı bir göz").

agents:
  topic_scout:
    provider: groq
    model: llama-3.3-70b-versatile
    fallback_models: [llama-3.1-8b-instant]
    max_tokens: 1500          # ölçülen çıktı ~600 token

  research:
    provider: groq
    model: openai/gpt-oss-20b
    fallback_models: [llama-3.3-70b-versatile]
    max_tokens: 2500          # prompt ~5.2k; reasoning payı dahil 8k tavanına sığmalı

  strategist:
    provider: groq
    model: openai/gpt-oss-20b
    fallback_models: [llama-3.3-70b-versatile]
    max_tokens: 2500          # ölçülen çıktı ~570 + reasoning payı

  writer:
    # Replicate: Groq'un dakikalık token tavanı (gpt-oss-120b'de 8k) writer'ın tek
    # isteğini (prompt 3.4k + max_tokens 4.2k ≈ 7.7k) neredeyse tamamen dolduruyordu;
    # editor retry turundaki ikinci çağrı hep 429 alıp run'ı kilitliyordu. Replicate'te
    # dakikalık token tavanı yok, AYNI model orada da mevcut ve Türkçe kalitesi ölçüldü
    # (871-975 kelime). Bu yüzden yalnızca bu ajan Replicate'e taşındı.
    provider: replicate
    # Replicate'te model adı `sahip/model` biçimindedir; sürüm kimliği config'de
    # tutulmaz, provider ilk kullanımda API'den okur.
    # Not: llama-3.3-70b denendi ve writer olarak KULLANILAMAZ — 1000 kelime istenmesine
    # rağmen ~315 kelime yazıyor ve Türkçesi bozuluyor.
    model: openai/gpt-oss-120b
    # Fallback listesi AYNI sağlayıcı içinde denenir; Groq model adları burada geçersiz.
    fallback_models: [openai/gpt-oss-20b]
    temperature: 0.3
    # DİKKAT — bu değeri düşürmeyin: gpt-oss bir reasoning modelidir ve max_tokens'ı
    # düşünme + metin arasında paylaşır (ölçüm: ~1300 token düşünme). 3500'e çekildiğinde
    # makale ~550 kelimede ORTASINDAN KESİLİYORDU (finish_reason=length).
    # ~1000 kelime Türkçe metin ≈ 2200 token + düşünme payı => 4200.
    max_tokens: 4200

  seo_optimizer:
    provider: groq
    # JSON döndüren rol -> her iki model de reasoning yapmayan sohbet modeli.
    model: llama-3.3-70b-versatile
    fallback_models: [llama-3.1-8b-instant]
    max_tokens: 1200

  linker:
    # LinkerAgent LLM ÇAĞIRMAZ (StateStore anahtar kelime örtüşmesi kullanır);
    # bu giriş yalnızca config bütünlüğü için durur.
    provider: groq
    model: llama-3.1-8b-instant
    fallback_models: []

  editor:
    # 07.08.2026: Replicate'ten Groq'a GERİ alındı, Replicate ikincil sağlayıcı oldu.
    #
    # Sebep: 06.08.2026 run'ında Replicate'teki llama-3, dört denemenin üçünde JSON
    # yerine markdown döndürdü ("**Decision:** rejected") ve yayın turu düştü. Replicate'in
    # metin modellerinde yapısal çıktı (`response_format`) parametresi YOK — JSON garantisi
    # yalnızca prompt'taki talimat kadar. Groq bu parametreyi destekliyor: model gramer
    # seviyesinde JSON dışına çıkamıyor.
    #
    # 30.07.2026'da Replicate'e taşınma gerekçesi (Groq'ta prompt ~5.5k token, kota
    # dolunca 6000 TPM tavanlı 8b'ye düşüp 413 alıyordu) artık geçerli değil: editor
    # prompt'undan deterministik katmanın kapsadığı kontroller çıkarıldı ve `content_scope`
    # kaldırıldı, max_tokens 1800'den 700'e indi. Yine de tavana takılma ihtimaline karşı
    # 8b'ye düşmek yerine doğrudan Replicate'e geçiliyor (aşağıdaki fallback_provider).
    provider: groq
    # "Writer'dan farklı göz" tasarımı korunuyor: writer gpt-oss ailesi, editor llama.
    model: llama-3.3-70b-versatile
    # AYNI sağlayıcı içindeki fallback bilinçli olarak BOŞ: llama-3.1-8b-instant'ın 6000
    # TPM tavanı bu prompt için dar ve 413 üretiyordu. Sağlayıcı tükendiğinde zincir
    # doğrudan Replicate'e geçer.
    fallback_models: []
    # Yapısal çıktı — bu ajanın JSON döndürmesi bir tercih değil, geçidin ön koşulu.
    response_format: json_object
    # 0.0: aynı makale aynı kararı almalı. Eski değer 0.2'ydi ve model aynı metni dört
    # kez farklı gerekçelerle reddediyordu; bir "hakem" bileşeninin deterministik olması
    # doğru davranışın kendisidir.
    temperature: 0.0
    # 1800 -> 700: gerekçeler artık serbest metin değil, alıntı taşıyan kısa nesneler ve
    # kontrol listesi maddeleri prompt'tan çıktığı için yanıt kısaldı. Küçük bütçe aynı
    # zamanda Groq'un dakikalık token rezervasyonunu düşürür.
    max_tokens: 700

    # Groq'un dakikalık kotası dolduğunda (ücretsiz kademede olağan) run ölmez, aynı
    # istek Replicate'te aynı model ailesiyle sürer. Orada yapısal çıktı olmadığı için
    # JSON garantisi prompt seviyesine iner — bunu telafi eden şey, Editor'ün her
    # gerekçeyi metne karşı doğrulaması (bkz. guards/review_guard.py): bozuk ya da
    # uydurma bir inceleme artık makaleyi haksız yere reddedemiyor.
    fallback_provider:
      provider: replicate
      model: meta/meta-llama-3-70b-instruct
      # Replicate'te dakikalık token tavanı yok; kesilmiş bir JSON'un bedeli tüm yayın
      # turu olduğu için burada bütçe cömert tutulur.
      max_tokens: 1200

  scope_guard:
    provider: groq
    # Ucuz/hızlı sınıflandırma yeterli.
    model: llama-3.1-8b-instant
    fallback_models: [llama-3.3-70b-versatile]
    max_tokens: 300
