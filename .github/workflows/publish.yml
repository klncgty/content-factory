name: Yayınla (3 günde bir)

# Zamanlama: 3 günde bir, 23:59 Europe/Istanbul. GitHub cron'u UTC çalıştığı için 20:59 UTC
# yazılır. Türkiye 2016'dan beri kalıcı UTC+3 kullanıyor (yaz saati uygulaması yok), yani
# bu dönüşüm yıl boyu sabittir — kayma olmaz.
#
# Günler `*/3` ile değil AÇIK LİSTE ile yazılıyor: `*/3` ayın 1, 4, 7, ... 28, 31'ine denk
# gelir; buradaki 3, 6, ... 30 listesi aynı 3 günlük ritmi verir ama fazı, ritmin
# başlangıcı olan 3 Ağustos 2026'ya oturtur. Ay sonunda tur 3-4 güne çıkar
# (ör. 30 -> sonraki ayın 3'ü); gerçek "her 72 saat" garantisi cron ile mümkün değil.
#
# Not: GitHub zamanlanmış run'ları yoğun saatlerde kuyruğa alır, tetikleme birkaç dakika
# (bazen ~15 dk) gecikebilir. Saat garantisi değil, ritim garantisidir.
on:
  schedule:
    - cron: "59 20 3,6,9,12,15,18,21,24,27,30 * *"
  workflow_dispatch: # Actions sekmesinden elle de tetiklenebilir (ilk deneme için)

# Aynı anda iki run çalışmasın: ikisi de aynı hedef repoya push eder ve aynı state
# veritabanını günceller.
concurrency:
  group: publish-oleart
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # state veritabanını bu repoya geri commit etmek için

    steps:
      - name: Motoru al
        uses: actions/checkout@v4

      - name: Hedef repoyu al (publish.yaml -> target_repo_path)
        uses: actions/checkout@v4
        with:
          repository: klncgty/oleart
          path: oleart.co
          token: ${{ secrets.GIT_TOKEN }}

      - name: uv kur
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Bağımlılıklar
        run: uv sync

      - name: Git kimliği (commit için zorunlu)
        # E-posta bir GitHub hesabına eşlenmeli. Sebep hedef repoda: oleart.co Vercel'de
        # barındırılıyor ve Vercel, author e-postasını bir hesapla eşleştiremediği
        # commit'lerin deploy'unu engelliyor — 30.07.2026'da makale main'e girdi ama siteye
        # çıkmadı ("commit email ... could not be matched to a GitHub account").
        # İsim bot olarak kalıyor; eşleşmeyi sağlayan alan e-postadır.
        run: |
          for repo in . oleart.co; do
            git -C "$repo" config user.name "content-factory[bot]"
            git -C "$repo" config user.email "cgtyklnc@gmail.com"
          done

      - name: Pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          REPLICATE_API_KEY: ${{ secrets.REPLICATE_API_KEY }}
          # Aşağıdakiler mevcut model profilinde kullanılmıyor ama config değişirse gerekir.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Hedef repoya push yetkisi (bkz. .env.example). Strateji direct-push olduğu
          # için PR izni gerekmiyor; sayfaların derlenmesini oleart.co'daki
          # .github/workflows/build-blog.yml bu push ile tetiklenerek yapar.
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
        # `--target-repo`: publish.yaml `../oleart.co` diyor, Actions'ta hedef repo
        # çalışma dizininin İÇİNE (`oleart.co/`) klonlanıyor.
        run: uv run content-factory --brand oleart --target-repo "$GITHUB_WORKSPACE/oleart.co"

      - name: Çalışma günlüğünü sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-logs
          path: state/oleart/runs/
          retention-days: 30
          if-no-files-found: ignore

      - name: State veritabanını geri commit et
        if: always() # pipeline yarıda kalsa da o ana kadarki durum korunmalı
        run: |
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "state değişmedi, commit atlanıyor"
            exit 0
          fi
          git add data/
          git commit -m "state: $(date -u +%Y-%m-%d) yayın run'ı"
          # Run sürerken main'e başka bir commit girmiş olabilir; çakışmada rebase edip
          # tekrar dene. Yalnızca data/ dosyaları değiştiği için rebase güvenli.
          git push || {
            git pull --rebase origin main
            git push
          }
